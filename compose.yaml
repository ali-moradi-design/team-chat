services:
  mongo:
    image: mongo:8
    command: ['--wiredTigerCacheSizeGB', '0.25']
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 5s
      retries: 10

  # Production-like run:  docker compose --profile app up --build
  app:
    build: .
    profiles: ['app']
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/team-chat
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (32+ random chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - '3001:3001'
    volumes:
      - uploads:/data/uploads
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    profiles: ['scale']
    restart: unless-stopped
    command: ['redis-server', '--maxmemory', '64mb', '--maxmemory-policy', 'allkeys-lru']

volumes:
  mongo-data:
  uploads:
