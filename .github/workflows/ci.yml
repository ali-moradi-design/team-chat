name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, unit + integration tests, build
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check # architecture (FSD + server modules) and performance budget

  e2e:
    name: Playwright (two users, responsive, long history)
    runs-on: ubuntu-latest
    needs: check
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @team-chat/web exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-results
          path: |
            apps/web/test-results
            apps/web/e2e-results
          retention-days: 7

  image:
    name: Docker image (build + production compose)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the same image CI on main pushes; here it is only built and started, nothing is pushed
      - run: docker build -t ghcr.io/ali-moradi-design/team-chat:ci .
      - name: Start it with deploy/compose.yaml (read-only, MongoDB with auth)
        working-directory: deploy
        run: |
          printf 'IMAGE_TAG=ci\nMONGO_PASSWORD=%s\nJWT_SECRET=%s\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > .env
          docker compose up -d --wait --wait-timeout 180 || { docker compose ps -a; docker compose logs; exit 1; }
          docker compose exec -T app node dist/scripts/seed.js
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:3106/health
          curl -fsS http://127.0.0.1:3106/api/config
          curl -fsS http://127.0.0.1:3106/ | grep -q '<div id="root">'
      - name: Image holds only build output
        run: |
          docker run --rm --entrypoint sh ghcr.io/ali-moradi-design/team-chat:ci -c 'ls /app; test ! -e /app/src && test ! -e /app/node_modules/typescript && test ! -e /app/node_modules/vite'
      - name: Logs
        if: failure()
        working-directory: deploy
        run: docker compose logs
