<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#170602" />
    <meta
      name="description"
      content="Team Chat — realtime channels, threads and direct messages."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Team Chat</title>
    <script>
      // Apply theme and language direction before first paint (no flash).
      (function () {
        try {
          var p = JSON.parse(localStorage.getItem('tc:prefs') || '{}');
          var theme = p.theme || 'dark';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          el.classList.toggle('dark', dark);
          el.classList.toggle('light', !dark);
          var lang = p.lang === 'fa' ? 'fa' : 'en';
          el.lang = lang;
          el.dir = lang === 'fa' ? 'rtl' : 'ltr';
          document
            .querySelector('meta[name=theme-color]')
            .setAttribute('content', dark ? '#170602' : '#fff8ef');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
