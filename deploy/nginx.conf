# /etc/nginx/sites-available/team-chat -> the app container on 127.0.0.1:3106.
# Symlink into sites-enabled, `nginx -t`, `systemctl reload nginx`; then
# certbot --nginx adds the TLS server block and the HTTP -> HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name team-chat.ali-moradi-develop.com;

    server_tokens off;
    # file sharing: 10 MB per file + multipart overhead
    client_max_body_size 11m;

    # never serve dotfiles (.env, .git)
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        proxy_pass http://127.0.0.1:3106;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # always overwrite: visitors cannot choose their own IP (rate limits)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Socket.IO uses WebSockets: pass the upgrade on
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # longer than the Socket.IO ping interval (25 s) + timeout (20 s)
        proxy_read_timeout 120s;
    }
}
